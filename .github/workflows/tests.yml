name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install FFmpeg and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements-dev.txt
      - name: Run tests without downloading speech models
        run: python -m pytest tests -q
      - name: Check browser script syntax
        run: |
          node --version
          node --check app/static/app.js
          for source in app/static/recorder/*.js app/static/recorder/*.mjs; do
            node --check "$source"
          done
      - name: Run recorder integration and PCM tests
        run: |
          node tests/recorder/integration.mjs
          node tests/recorder/pcm.mjs
          node tests/recorder/devices.mjs
